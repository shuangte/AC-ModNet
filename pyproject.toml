[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "acmodnet"
version = "1.0.0"
description = "AC-ModNet: molecular reverse design network based on attribute classification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["torch>=1.11", "rdkit", "networkx", "numpy", "pandas", "tqdm"]
[project.optional-dependencies]
dev = ["pytest"]
[tool.setuptools]
packages = ["acmodnet", "hgraph"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
